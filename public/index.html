<!DOCTYPE html>
<html>
<head>
    <title>Display Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/output.css" rel="stylesheet">
    <script src="/js/display.js" defer></script>
</head>
<body class="bg-white flex justify-center items-center min-h-screen m-0 p-0">
    <div id="content-container" class="w-screen h-screen relative">

        <!-- Logo container -->
        <div id="logo-container" class="absolute inset-0 flex justify-center items-center transition-opacity duration-500 opacity-100 p-8 cursor-pointer z-50">
            <img 
                src="/images/storylogo.png" 
                alt="Story Logo" 
                class="max-h-screen max-w-screen object-contain"
            >
        </div>

        <!-- gif container -->
        <div id="gif-container" class="w-screen h-screen object-cover opacity-0">
            <img 
                id="gif-display"
                src="/images/gifs/surprised.gif" 
                alt="Surprised Animation" 
                class="w-screen h-screen object-cover"
            >
        </div>

        <!-- Message container -->
        <div 
            id="message-display" 
            class="absolute inset-0 flex justify-center items-center opacity-0 transition-opacity duration-500"
        >
            <div class="text-9xl p-8 rounded-lg max-w-2xl text-center">
                Waiting for messages...
            </div>
        </div>

        <!-- User list container -->
        <div 
            id="user-list-container" 
            class="absolute inset-0 flex flex-col justify-center items-center opacity-0 transition-opacity duration-500 bg-white"
        >
            <h1 class="text-6xl font-bold mb-8 text-gray-800">Users Online</h1>
            <div class="space-y-6">
                <div class="text-4xl text-gray-700 text-center px-8 py-4 bg-gray-100 rounded-lg shadow-sm">Alice Johnson</div>
                <div class="text-4xl text-gray-700 text-center px-8 py-4 bg-gray-100 rounded-lg shadow-sm">Bob Smith</div>
                <div class="text-4xl text-gray-700 text-center px-8 py-4 bg-gray-100 rounded-lg shadow-sm">Charlie Brown</div>
            </div>
        </div>

        <!-- Connection status indicator -->
        <div 
            id="connection-status" 
            class="absolute bottom-4 right-4 w-4 h-4 rounded-full transition-all duration-300 opacity-100 hidden"
            title="Connection Status"
        >
            <!-- Pulse animation for disconnected state -->
            <div class="absolute inset-0 rounded-full animate-ping bg-red-400 opacity-75"></div>
            <!-- Solid circle -->
            <div class="absolute inset-0 rounded-full bg-red-500"></div>
        </div>
    </div>


    <style>
        @keyframes ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        .animate-ping {
            animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
    </style>
</body>
</html>
